name: Portable release builds

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build and test dependencies
        run: python -m pip install -e '.[dev]' 'pyinstaller>=6.11,<7'
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: python
        run: |
          import importlib.metadata, os
          expected = 'v' + importlib.metadata.version('mahjong-jev-advisor')
          assert os.environ['GITHUB_REF_NAME'] == expected, f'Tag must match package version: {expected}'
      - name: Run regression tests
        run: python -m pytest -q
      - name: Build and smoke-test portable app
        run: python scripts/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          compression-level: 0
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics-${{ matrix.os }}
          path: |
            build/*-smoke.json
            build/freeze/**/warn-*.txt
          if-no-files-found: ignore

  draft-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: portable-*
          path: artifacts
          merge-multiple: true
      - name: Create draft with verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --generate-notes
          fi
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          gh release upload "$RELEASE_TAG" artifacts/*.zip artifacts/*.sha256 --clobber
